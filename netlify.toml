[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"

# Single-Page Application (SPA) routing: ensures all routes (like /dashboard, /login) load index.html seamlessly
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers & cache control
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"


