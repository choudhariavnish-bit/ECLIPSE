services:
  - type: web
    name: eclipse-web
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: eclipse-api
    env: python
    buildCommand: pip install -r ai-engine/requirements.txt
    startCommand: uvicorn ai-engine.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
