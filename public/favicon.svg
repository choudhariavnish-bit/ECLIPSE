<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
    <defs>
        <linearGradient id="eclipseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4f46e5" />
            <stop offset="50%" stop-color="#7c3aed" />
            <stop offset="100%" stop-color="#f97316" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    <!-- Background Circle -->
    <circle cx="50" cy="50" r="46" fill="#0f172a" />
    <!-- Gradient Eclipse Ring -->
    <circle cx="50" cy="50" r="38" fill="none" stroke="url(#eclipseGrad)" stroke-width="7" filter="url(#glow)" />
    <!-- Inner Shield / Brand Governance Symbol -->
    <path d="M50 24 L68 34 V52 C68 64 50 74 50 74 C50 74 32 64 32 52 V34 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <!-- Checkmark Verification -->
    <path d="M42 50 L47 55 L58 43" fill="none" stroke="#4ade80" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
