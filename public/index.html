<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ECLIPSE AI - Brand Governance Platform (React)</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            first: '#e0ffcd',
            second: '#fdffcd',
            third: '#ffebbb',
            fourth: '#ffcab0',
          }
        }
      }
    }
  </script>
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- React 18 & ReactDOM 18 UMD (Fast CDN) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }

    body {
      background-color: #fafaf6 !important;
      background: linear-gradient(135deg, #fdfdf9 0%, #fffcf5 45%, #f6fcf3 100%) !important;
      background-attachment: fixed !important;
      color: #1c1917 !important;
    }

    .first-color { background-color: #e0ffcd !important; }
    .second-color { background-color: #fcfcf5 !important; }
    .third-color { background-color: #ffebbb !important; }
    .fourth-color { background-color: #ffcab0 !important; }

    .bg-white {
      background-color: rgba(255, 255, 255, 0.96) !important;
      border-color: #f2ead8 !important;
    }

    .border-slate-200, .border-slate-100 {
      border-color: #f2ead8 !important;
    }

    .bg-blue-600, .bg-blue-700, .bg-slate-900:not(pre) {
      background-color: #ffcab0 !important;
      color: #291206 !important;
      border-color: #f7a077 !important;
    }

    .bg-emerald-50, .bg-emerald-100, .bg-blue-50, .bg-blue-100 {
      background-color: #e0ffcd !important;
      color: #173d09 !important;
      border-color: #b7e89e !important;
    }

    .bg-purple-50, .bg-purple-100, .bg-amber-50, .bg-amber-100 {
      background-color: #ffebbb !important;
      color: #573305 !important;
      border-color: #f2cb7e !important;
    }
  </style>
</head>
<body class="bg-[#fdffcd] text-stone-900 min-h-screen selection:bg-[#ffcab0] selection:text-stone-950">
  <!-- React Root Container -->
  <div id="root"></div>

  <!-- Pre-compiled Native React 18 Application Bundle -->
  <script src="/js/app.bundle.js"></script>
</body>
</html>
