<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Active Drafts Ledger | Inkloom AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col selection:bg-blue-600 selection:text-white">

  <!-- Navbar -->
  <div id="main-navbar"></div>

  <!-- Body Content with Sidebar -->
  <div class="flex-1 flex max-w-7xl w-full mx-auto">
    <!-- Sidebar -->
    <div id="main-sidebar"></div>

    <!-- Main Workspace -->
    <main class="flex-1 p-4 sm:p-6 lg:p-8 space-y-6 overflow-y-auto">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-slate-200">
        <div>
          <h1 class="text-xl font-bold tracking-tight text-slate-900">Active Drafts Ledger</h1>
          <p class="text-xs text-slate-500 mt-0.5">Author articles, social campaigns, and visual marketing assets stored in the database.</p>
        </div>

        <a href="/creator.html" class="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs shadow-xs transition-colors inline-flex items-center gap-2">
          <i data-lucide="plus" class="w-4 h-4"></i>
          <span>New Studio Draft</span>
        </a>
      </div>

      <!-- Drafts Table -->
      <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-xs space-y-4">
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs">
            <thead class="bg-slate-50 text-slate-500 font-bold uppercase text-[10px] tracking-wider border-b border-slate-200">
              <tr>
                <th class="py-2.5 px-3">Draft Title &amp; ID</th>
                <th class="py-2.5 px-3">Brand</th>
                <th class="py-2.5 px-3">Author</th>
                <th class="py-2.5 px-3">Status</th>
                <th class="py-2.5 px-3">Drift Score</th>
                <th class="py-2.5 px-3 text-right">Updated</th>
              </tr>
            </thead>
            <tbody id="drafts-table-body" class="divide-y divide-slate-100">
              <!-- Dynamically populated -->
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/app.js"></script>
  <script>
    App.requireAuth();
    const role = App.getRole();
    App.renderNavbar('drafts');
    App.renderSidebar('drafts');

    async function loadDrafts() {
      const tbody = document.getElementById("drafts-table-body");
      try {
        const res = await fetch("/api/drafts");
        const data = await res.json();
        const drafts = data.drafts || [];

        tbody.innerHTML = drafts.map(d => `
          <tr class="hover:bg-slate-50 transition-colors">
            <td class="py-3 px-3">
              <div class="font-bold text-slate-900">${d.title}</div>
              <div class="text-[10px] font-mono text-slate-400">${d.id}</div>
            </td>
            <td class="py-3 px-3 font-semibold text-slate-700">${d.brand || 'LoomCraft Studio'}</td>
            <td class="py-3 px-3 text-slate-600">${d.author || 'Author'}</td>
            <td class="py-3 px-3">
              <span class="px-2 py-0.5 rounded text-[10px] font-bold ${
                d.status === 'published' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' :
                d.status === 'under_review' ? 'bg-amber-50 text-amber-700 border border-amber-200' :
                'bg-slate-100 text-slate-700 border border-slate-200'
              }">${(d.status || 'draft').toUpperCase()}</span>
            </td>
            <td class="py-3 px-3">
              <span class="font-mono font-bold text-xs ${
                (d.driftScore || 0) < 15 ? 'text-emerald-600' : (d.driftScore || 0) < 50 ? 'text-amber-600' : 'text-red-600'
              }">${d.driftScore ?? 12}%</span>
            </td>
            <td class="py-3 px-3 text-right font-mono text-[11px] text-slate-400">
              ${new Date(d.updatedAt || Date.now()).toLocaleDateString()}
            </td>
          </tr>
        `).join("");
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="6" class="py-4 text-center text-slate-400">No active drafts found.</td></tr>`;
      }
      lucide.createIcons();
    }

    loadDrafts();
  </script>
</body>
</html>
