# Render Blueprint for Inkloom AI Brand Governance Backend
services:
  - type: web
    name: inkloom-governance-backend
    runtime: node
    plan: starter
    region: oregon
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: inkloom-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ZERO_DATA_RETENTION
        value: "true"

databases:
  - name: inkloom-postgres
    plan: free
    region: oregon
    databaseName: inkloom_governance
    user: inkloom_admin

